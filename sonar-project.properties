sonar.projectKey=dashboard-tcc
sonar.projectName=DashboardTCC
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/__pycache__/**,**/migrations/**,**/*.png,**/*.svg,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,backend/app/tests/**

sonar.tests=frontend/src,backend/app/tests
sonar.test.inclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,backend/app/tests/**

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.python.version=3.12
