services:
  frontend-sistema-monitoramento:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend-sistema-monitoramento
    hostname: dkr-frontend-sistema-monitoramento
    stdin_open: true
    tty: true
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ./.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
